<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>店舗せどりウォッチ</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
    --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
    --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
  }
}
:root[data-theme="dark"]{
  --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
  --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
  --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
}
:root[data-theme="light"]{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.mast{background:var(--surface); border-bottom:1px solid var(--line)}
.mast-in{max-width:1280px; margin:0 auto; padding:14px 16px;
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px}
.brand{font-size:22px; font-weight:800; letter-spacing:.02em}
.brand b{color:var(--accent)}
.today{color:var(--muted); font-size:12.5px}
.count{margin-left:auto; font-size:12.5px; color:var(--muted)}
.count b{color:var(--ink); font-size:15px}
.wrap{max-width:1280px; margin:0 auto; padding:16px 16px 60px}

.cattabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.cattabs button{appearance:none; font-family:inherit; cursor:pointer; font-size:13px;
  font-weight:700; padding:6px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink)}
.cattabs button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.cattabs button .n{color:var(--muted); font-weight:600; margin-left:3px}
.cattabs button.on .n{color:var(--bg); opacity:.75}

.filterbar{background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:12px 14px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.filterbar input[type=text]{font-family:inherit; font-size:13px; padding:7px 10px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  min-width:220px; flex:1 1 220px}
.filterbar select{font-family:inherit; font-size:13px; padding:7px 10px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.filterbar label{font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
.fb-reset{appearance:none; font-family:inherit; cursor:pointer; font-size:12px; font-weight:700;
  padding:5px 12px; border-radius:999px; border:1px solid var(--accent); background:var(--surface); color:var(--accent)}
.fb-reset:hover{background:var(--accent); color:#fff}
.fb-summary{font-size:12px; color:var(--muted); width:100%}
.fb-summary b{color:var(--ink)}

.note-box{font-size:12px; color:var(--muted); background:var(--tint); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; margin-bottom:14px}
.note-box b{color:var(--ink)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .12s ease, box-shadow .12s ease}
@media(prefers-reduced-motion:no-preference){
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.10)}
}
.card.up{outline:2px solid var(--green)}
.card.down{outline:2px solid var(--accent)}
.card .imgbox{position:relative; aspect-ratio:1/1; background:var(--tint)}
.card .imgbox img{width:100%; height:100%; object-fit:contain; display:block}
.card .bdg{position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.card .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:5px; flex:1}
.card .t{font-size:13px; font-weight:700; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .mk{font-size:11.5px; color:var(--muted)}
.card .foot{display:flex; justify-content:space-between; align-items:baseline}
.card .dt{font-size:12px; color:var(--muted)}
.card .pr{font-size:14px; font-weight:800}
.card .ebayrow{font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:6px}
.card .ebayrow b{color:var(--ink)}
.card .toplist{display:flex; flex-direction:column; gap:2px; font-size:11px}
.card .toplist a{color:var(--indigo); font-weight:600}
.card .toplist a:hover{text-decoration:underline}
.card .toplist .p{color:var(--muted); margin-left:4px}
.card .private{font-size:11.5px; color:var(--purple); border-top:1px dashed var(--line); padding-top:6px}
.card .note{font-size:11px; color:var(--muted); white-space:pre-wrap}
.card .srch{margin-top:2px}
.card .srch a{color:var(--indigo); font-weight:700; margin-right:8px; font-size:11.5px}
.card .srch a:hover{text-decoration:underline}

.chip{display:inline-block; padding:1px 7px; border-radius:3px; font-size:11px;
  font-weight:700; line-height:1.7; white-space:nowrap}
.chip.cat{color:#fff; background:var(--indigo)}
.chip.new{color:#fff; background:var(--accent)}
.chip.pct-up{color:#fff; background:var(--green)}
.chip.pct-down{color:#fff; background:var(--accent)}
.chip.judge-buy{color:#fff; background:var(--indigo)}
.chip.judge-list{color:#fff; background:var(--green)}
.chip.judge-pass{color:var(--muted); border:1px solid var(--line); background:var(--surface)}
.empty{padding:40px 16px; text-align:center; color:var(--muted)}
footer{max-width:1280px; margin:20px auto 0; padding:0 16px; color:var(--muted); font-size:11.5px}
@media(max-width:560px){
  .filterbar input[type=text]{min-width:0; width:100%}
  .count{margin-left:0; width:100%}
}
</style>
</head>

      </div>
      <div class="body">
        <div class="t"><a href="${esc(it.product_url)}" target="_blank" rel="noopener">${esc(it.name)}</a></div>
        <div class="mk">${esc(it.maker || "メーカー不明")}｜${esc(it.source || "")}${it.jan ? "｜JAN:"+esc(it.jan) : ""}</div>
        <div class="foot"><span class="dt num">${esc(it.release_date || "発売日未定")}</span><span class="pr num">${it.price_jpy!=null ? fmtJpy(it.price_jpy) : ""}</span></div>
        <div class="ebayrow">
          出品数(全体/JP) <b class="num">${fmtNum(it.ebay_total)}</b>/<b class="num">${fmtNum(it.ebay_total_jp)}</b> ${changeChip(it)}
          ｜JPセラー比率 <b class="num">${fmtPct(it.jp_seller_ratio)}</b><br>
          最安/中央値 <b class="num">${fmtUsd(it.ebay_min_usd)}</b>/<b class="num">${fmtUsd(it.ebay_median_usd)}</b>
          ｜売れ数サンプル <b class="num">${fmtNum(it.quantity_sold_sample)}</b>
        </div>
        ${topItemsHtml(it)}
        <div class="srch"><a href="${ebaySearchUrl(it)}" target="_blank" rel="noopener">eBay検索</a><a href="${terapeakUrl(it)}" target="_blank" rel="noopener">Terapeak</a></div>
        ${privateRow}
        ${judgeChip(it.judgment)}
        ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
      </div>
    </div>`;
}

function currentData(){
  return DATA.filter(item => {
    if(activeCat && item.category !== activeCat) return false;
    if(sourceFilter && item.source !== sourceFilter) return false;
    if(judgeFilter){
      if(judgeFilter === "__blank__"){ if(item.judgment) return false; }
      else if(item.judgment !== judgeFilter) return false;
    }
    if(keyword){
      const hay = [item.name, item.maker, item.jan, item.source, item.note].join(" ").toLowerCase();
      if(hay.indexOf(keyword) === -1) return false;
    }
    return true;
  });
}

function sortData(list){
  return list.slice().sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(sortKey === "release_date" || sortKey === "first_detected"){
      av = av || (sortDir === 1 ? "9999" : "0000");
      bv = bv || (sortDir === 1 ? "9999" : "0000");
      return av > bv ? sortDir : (av < bv ? -sortDir : 0);
    }
    av = (av === null || av === undefined || av === "") ? -Infinity : Number(av);
    bv = (bv === null || bv === undefined || bv === "") ? -Infinity : Number(bv);
    return (av - bv) * sortDir;
  });
}

function renderCattabs(){
  const counts = {};
  DATA.forEach(it => { counts[it.category] = (counts[it.category]||0) + 1; });
  const cats = Object.keys(counts).sort();
  const box = document.getElementById("cattabs");
  let html = `<button data-cat="" class="${activeCat===""?"on":""}">すべて<span class="n">${DATA.length}</span></button>`;
  html += cats.map(c => {
    const label = (DATA.find(it=>it.category===c)||{}).category_label || c;
    return `<button data-cat="${esc(c)}" class="${activeCat===c?"on":""}">${esc(c)}：${esc(label)}<span class="n">${counts[c]}</span></button>`;
  }).join("");
  box.innerHTML = html;
  box.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { activeCat = btn.dataset.cat; render(); });
  });
}

function renderSourceOptions(){
  const sel = document.getElementById("sourceSelect");
  const sources = Array.from(new Set(DATA.map(it => it.source).filter(Boolean))).sort();
  const cur = sel.value;
  sel.innerHTML = `<option value="">すべて</option>` + sources.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  sel.value = cur;
}

function render(){
  renderCattabs();
  const filtered = sortData(currentData());
  const grid = document.getElementById("grid");
  const emptyMsg = document.getElementById("emptyMsg");
  if(filtered.length === 0){
    grid.innerHTML = "";
    emptyMsg.hidden = false;
  } else {
    emptyMsg.hidden = true;
    grid.innerHTML = filtered.map(cardHtml).join("");
  }
  document.getElementById("fbSummary").innerHTML = `<b>${filtered.length}</b> / ${DATA.length} 件を表示中`;
  document.getElementById("countNum").textContent = DATA.length;
}

document.getElementById("kwInput").addEventListener("input", (e) => { keyword = e.target.value.trim().toLowerCase(); render(); });
document.getElementById("sourceSelect").addEventListener("change", (e) => { sourceFilter = e.target.value; render(); });
document.getElementById("judgeSelect").addEventListener("change", (e) => { judgeFilter = e.target.value; render(); });
document.getElementById("sortSelect").addEventListener("change", (e) => {
  const [key, dir] = e.target.value.split(":");
  sortKey = key; sortDir = dir === "asc" ? 1 : -1;
  render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  activeCat = ""; judgeFilter = ""; sourceFilter = ""; keyword = "";
  document.getElementById("kwInput").value = "";
  document.getElementById("judgeSelect").value = "";
  document.getElementById("sourceSelect").value = "";
  document.getElementById("sortSelect").value = "first_detected:desc";
  sortKey = "first_detected"; sortDir = -1;
  render();
});

renderSourceOptions();
render();
</script>
</body>
</html>
